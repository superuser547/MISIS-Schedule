[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misis-schedule"
version = "1.0.0"
description = "Преобразование Excel-расписания МИСИС в iCalendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "icalendar>=6.0,<7.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "streamlit>=1.40,<2.0",
    "xlrd>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["misis_schedule*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
