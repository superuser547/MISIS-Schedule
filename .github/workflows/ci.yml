name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: pip install -e ".[dev]"
      - name: Проверить стиль
        run: ruff check .
      - name: Запустить тесты
        run: pytest
